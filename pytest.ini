[pytest]
# Tell pytest-django which settings module to use when running tests
DJANGO_SETTINGS_MODULE = ziada.settings.development

# Look for tests in the apps/ directory
testpaths = apps

# Show extra test output
addopts = -v --tb=short

# Suppress noisy warnings from third-party packages
filterwarnings =
    ignore::DeprecationWarning:factory_boy
    ignore::DeprecationWarning:faker
